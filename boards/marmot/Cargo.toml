[package]
name = "marmot"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
veloxity_core = { workspace = true }
veloxity_mavlink = { workspace = true }

embassy-rp = { version = "0.10.0", features = [
  "rp235xb",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "rom-v2-intrinsics",
  "executor-thread",
  "executor-interrupt",
] }
embassy-executor = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"

cortex-m = "0.7.7"
cortex-m-rt = "0.7.0"
critical-section = "1.2.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fixed = "1.31.0"
heapless = { version = "0.8.0", default-features = false }
pio = "0.3.0"
static_cell = "2.1"
panic-halt = "1.0.0"

[lints]
workspace = true

[[bin]]
name = "veloxity"
test = false
bench = false
doc = false
